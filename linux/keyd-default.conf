# Windows-style layout switch.
# Tap Ctrl+Shift alone        -> emits Super+space (GNOME switches layout)
# Ctrl+Shift held + other key -> normal shortcut, layout does NOT change

[ids]
*

[control]
leftshift = overload(shift, macro(M-space))
rightshift = overload(shift, macro(M-space))

[shift]
leftcontrol = overload(control, macro(M-space))
rightcontrol = overload(control, macro(M-space))
